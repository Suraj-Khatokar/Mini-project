<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Organic Connect</title>
    <style>
        :root {
            --bg-primary: #0B1120;
            --bg-secondary: #003300;
            --accent-primary: #00FFC6;
            --accent-secondary: #00FF9C;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 255, 198, 0.2);
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(15px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            font-size: 1rem;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-primary);
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-outline:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0, 255, 198, 0.6);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: 2px solid var(--accent-primary);
        }

        .btn-primary:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            box-shadow: 0 0 20px rgba(0, 255, 198, 0.6);
            transform: translateY(-2px);
        }

        /* Signup Section */
        .signup-section {
            padding: 12rem 5% 6rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 3rem;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .signup-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .signup-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        /* User Type Tabs */
        .user-type-tabs {
            display: flex;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }

        .tab.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 4px 15px rgba(0, 255, 198, 0.3);
        }

        /* Forms */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 2px solid var(--card-border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 255, 198, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 0.3rem;
            accent-color: var(--accent-primary);
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .checkbox-group a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .signup-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            margin-top: 0.5rem;
        }

        .signup-btn:hover {
            background: var(--accent-secondary);
            box-shadow: 0 0 25px rgba(0, 255, 198, 0.5);
            transform: translateY(-2px);
        }

        .additional-links {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
        }

        .additional-links a {
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .additional-links a:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        /* Farmer-specific fields */
        .farmer-fields {
            background: rgba(0, 255, 198, 0.05);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--accent-primary);
            margin-bottom: 1.5rem;
        }

        .farmer-fields h4 {
            color: var(--accent-primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1.2rem;
                padding: 1rem 5%;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .signup-section {
                padding: 10rem 5% 4rem;
            }

            .signup-container {
                padding: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 1.5rem;
            }
            
            .user-type-tabs {
                flex-direction: column;
            }
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
        }

        .error-message {
            color: var(--danger);
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 4px;
            border-left: 3px solid var(--danger);
            display: none;
        }

        .success-message {
            color: var(--success);
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 4px;
            border-left: 3px solid var(--success);
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navbar - Same as homepage -->
    <nav class="navbar">
        <div class="logo">Smart Organic Connect</div>
        <div class="nav-links">
            <a href="/static/index.html">Home</a>
            <a href="/static/marketplace.html">Marketplace</a>
            <a href="/static/about.html">About</a>
            <a href="/static/contact.html">Contact</a>
        </div>
        <div class="auth-buttons">
            <a href="/static/login.html" class="btn btn-outline">Login</a>
            <a href="/static/signup.html" class="btn btn-primary">Sign Up</a>
        </div>
    </nav>

    <!-- Signup Section -->
    <section class="signup-section">
        <div class="signup-container">
            <h1 class="signup-title">Create Account</h1>
            <p class="signup-subtitle">Join our organic community today</p>
            
            <div class="user-type-tabs">
                <button class="tab active" onclick="switchTab('customer')">Customer</button>
                <button class="tab" onclick="switchTab('farmer')">Farmer</button>
            </div>

            <!-- Customer Signup Form -->
            <div id="customer-form" class="form-section active">
                <form id="customer-signup-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer-firstname">First Name *</label>
                            <input type="text" id="customer-firstname" name="first_name" class="form-input" placeholder="Enter first name" required>
                        </div>
                        <div class="form-group">
                            <label for="customer-lastname">Last Name *</label>
                            <input type="text" id="customer-lastname" name="last_name" class="form-input" placeholder="Enter last name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="customer-email">Email Address *</label>
                        <input type="email" id="customer-email" name="email" class="form-input" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="customer-phone">Phone Number</label>
                        <input type="tel" id="customer-phone" name="phone" class="form-input" placeholder="+91 98765 43210">
                    </div>

                    <div class="form-group">
                        <label for="customer-address">Delivery Address</label>
                        <textarea id="customer-address" name="address" class="form-input" placeholder="Enter your delivery address" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="customer-password">Password *</label>
                        <input type="password" id="customer-password" name="password" class="form-input" placeholder="Create a password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="customer-confirm-password">Confirm Password *</label>
                        <input type="password" id="customer-confirm-password" class="form-input" placeholder="Confirm your password" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="customer-terms" required>
                        <label for="customer-terms">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="signup-btn" id="customer-submit-btn">
                        <span class="btn-text">Create Customer Account</span>
                        <span class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Creating Account...
                        </span>
                    </button>
                </form>
                <div id="customer-error" class="error-message"></div>
                <div id="customer-success" class="success-message"></div>
            </div>

            <!-- Farmer Signup Form -->
            <div id="farmer-form" class="form-section">
                <form id="farmer-signup-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="farmer-firstname">First Name *</label>
                            <input type="text" id="farmer-firstname" name="first_name" class="form-input" placeholder="Enter first name" required>
                        </div>
                        <div class="form-group">
                            <label for="farmer-lastname">Last Name *</label>
                            <input type="text" id="farmer-lastname" name="last_name" class="form-input" placeholder="Enter last name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="farmer-email">Email Address *</label>
                        <input type="email" id="farmer-email" name="email" class="form-input" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="farmer-phone">Phone Number</label>
                        <input type="tel" id="farmer-phone" name="phone" class="form-input" placeholder="+91 98765 43210">
                    </div>

                    <div class="form-group">
                        <label for="farmer-address">Farm Address</label>
                        <textarea id="farmer-address" name="address" class="form-input" placeholder="Enter your farm address" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="farmer-password">Password *</label>
                        <input type="password" id="farmer-password" name="password" class="form-input" placeholder="Create a password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="farmer-confirm-password">Confirm Password *</label>
                        <input type="password" id="farmer-confirm-password" class="form-input" placeholder="Confirm your password" required>
                    </div>

                    <!-- Farmer-specific fields -->
                    <div class="farmer-fields">
                        <h4>Farm Information</h4>
                        <div class="form-group">
                            <label for="farm-name">Farm Name *</label>
                            <input type="text" id="farm-name" name="farm_name" class="form-input" placeholder="Enter your farm name" required>
                        </div>
                        <div class="form-group">
                            <label for="farm-location">Farm Location *</label>
                            <input type="text" id="farm-location" name="farm_location" class="form-input" placeholder="City, State" required>
                        </div>
                        <div class="form-group">
                            <label for="farm-type">Primary Products *</label>
                            <input type="text" id="farm-type" name="primary_products" class="form-input" placeholder="e.g., Grains, Vegetables, Fruits" required>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="farmer-terms" required>
                        <label for="farmer-terms">
                            I agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and <a href="#">Farmer Agreement</a>
                        </label>
                    </div>

                    <button type="submit" class="signup-btn" id="farmer-submit-btn">
                        <span class="btn-text">Create Farmer Account</span>
                        <span class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Creating Account...
                        </span>
                    </button>
                </form>
                <div id="farmer-error" class="error-message"></div>
                <div id="farmer-success" class="success-message"></div>
            </div>

            <div class="additional-links">
                <a href="/static/login.html">Already have an account? Login</a>
            </div>
        </div>
    </section>

    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            // Remove any existing auth state
            localStorage.removeItem('authToken');
            localStorage.removeItem('authUser');
            
            // Initialize form handlers
            setupFormHandlers();
            
            // Check if already logged in (shouldn't happen, but just in case)
            const authUser = localStorage.getItem('authUser');
            if (authUser) {
                const user = JSON.parse(authUser);
                const redirectUrl = user.role === 'farmer' ? 'farmer-dashboard.html' : 'dashboard.html';
                window.location.href = redirectUrl;
            }
        });
        
        function setupFormHandlers() {
            // Customer form handler
            const customerForm = document.getElementById('customer-signup-form');
            if (customerForm) {
                customerForm.addEventListener('submit', handleCustomerSignup);
            }
            
            // Farmer form handler
            const farmerForm = document.getElementById('farmer-signup-form');
            if (farmerForm) {
                farmerForm.addEventListener('submit', handleFarmerSignup);
            }

            // Password confirmation validation
            setupPasswordValidation();
        }

        function setupPasswordValidation() {
            // Customer password confirmation
            const customerPassword = document.getElementById('customer-password');
            const customerConfirm = document.getElementById('customer-confirm-password');
            
            if (customerPassword && customerConfirm) {
                customerConfirm.addEventListener('input', function() {
                    if (customerPassword.value !== customerConfirm.value) {
                        customerConfirm.style.borderColor = 'var(--danger)';
                    } else {
                        customerConfirm.style.borderColor = 'var(--success)';
                    }
                });
            }

            // Farmer password confirmation
            const farmerPassword = document.getElementById('farmer-password');
            const farmerConfirm = document.getElementById('farmer-confirm-password');
            
            if (farmerPassword && farmerConfirm) {
                farmerConfirm.addEventListener('input', function() {
                    if (farmerPassword.value !== farmerConfirm.value) {
                        farmerConfirm.style.borderColor = 'var(--danger)';
                    } else {
                        farmerConfirm.style.borderColor = 'var(--success)';
                    }
                });
            }
        }
        
        function handleCustomerSignup(event) {
            event.preventDefault();
            const form = event.target;
            
            // Validate passwords match
            const password = document.getElementById('customer-password').value;
            const confirmPassword = document.getElementById('customer-confirm-password').value;
            
            if (password !== confirmPassword) {
                showError('customer-error', 'Passwords do not match');
                return;
            }

            const data = {
                first_name: form.querySelector('#customer-firstname').value.trim(),
                last_name: form.querySelector('#customer-lastname').value.trim(),
                email: form.querySelector('#customer-email').value.trim(),
                phone: form.querySelector('#customer-phone').value.trim(),
                address: form.querySelector('#customer-address').value.trim(),
                password: password,
                role: 'customer'
            };
            
            // Basic validation
            if (!data.first_name || !data.last_name || !data.email || !data.password) {
                showError('customer-error', 'Please fill in all required fields');
                return;
            }

            submitSignup(data, 'customer');
        }
        
        function handleFarmerSignup(event) {
            event.preventDefault();
            const form = event.target;
            
            // Validate passwords match
            const password = document.getElementById('farmer-password').value;
            const confirmPassword = document.getElementById('farmer-confirm-password').value;
            
            if (password !== confirmPassword) {
                showError('farmer-error', 'Passwords do not match');
                return;
            }

            const data = {
                first_name: form.querySelector('#farmer-firstname').value.trim(),
                last_name: form.querySelector('#farmer-lastname').value.trim(),
                email: form.querySelector('#farmer-email').value.trim(),
                phone: form.querySelector('#farmer-phone').value.trim(),
                address: form.querySelector('#farmer-address').value.trim(),
                password: password,
                role: 'farmer',
                farmer_profile: {
                    farm_name: form.querySelector('#farm-name').value.trim(),
                    farm_location: form.querySelector('#farm-location').value.trim(),
                    primary_products: form.querySelector('#farm-type').value.trim()
                }
            };
            
            // Basic validation
            if (!data.first_name || !data.last_name || !data.email || !data.password || 
                !data.farmer_profile.farm_name || !data.farmer_profile.farm_location || 
                !data.farmer_profile.primary_products) {
                showError('farmer-error', 'Please fill in all required fields');
                return;
            }

            submitSignup(data, 'farmer');
        }
        
        async function submitSignup(data, userType) {
            const submitBtn = document.getElementById(`${userType}-submit-btn`);
            const btnText = submitBtn.querySelector('.btn-text');
            const loading = submitBtn.querySelector('.loading');
            const errorElement = document.getElementById(`${userType}-error`);
            const successElement = document.getElementById(`${userType}-success`);

            // Show loading state
            btnText.style.display = 'none';
            loading.classList.add('show');
            hideMessage(errorElement);
            hideMessage(successElement);

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.detail || 'Signup failed. Please try again.');
                }

                // Show success message
                showSuccess(`${userType}-success`, 'Account created successfully! Redirecting to login...');
                
                // Store user data and token
                if (result.token && result.user) {
                    localStorage.setItem('authToken', result.token);
                    localStorage.setItem('authUser', JSON.stringify(result.user));
                }

                // Redirect to login after delay
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Signup error:', error);
                showError(`${userType}-error`, error.message || 'An error occurred during signup. Please try again.');
                
                // Reset button state
                btnText.style.display = 'inline-block';
                loading.classList.remove('show');
            }
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        function hideMessage(element) {
            if (element) {
                element.style.display = 'none';
            }
        }
        
        // Tab switching functionality
        function switchTab(type) {
            // Hide all forms and remove active class from tabs
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected form and activate tab
            document.getElementById(`${type}-form`).classList.add('active');
            document.querySelector(`.tab[onclick*="${type}"]`).classList.add('active');

            // Clear any messages when switching tabs
            hideMessage(document.getElementById('customer-error'));
            hideMessage(document.getElementById('customer-success'));
            hideMessage(document.getElementById('farmer-error'));
            hideMessage(document.getElementById('farmer-success'));
        }
    </script>
</body>
</html>
