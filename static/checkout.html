<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Smart Organic Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0B1120;
            --bg-secondary: #003300;
            --accent-primary: #00FFC6;
            --accent-secondary: #00FF9C;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 255, 198, 0.2);
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(15px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
        }

        .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent-primary); }

        .nav-links { display: flex; gap: 2rem; }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .cart-icon {
            position: relative;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .checkout-wrapper {
            max-width: 1100px;
            margin: 6rem auto 2rem;
            padding: 0 5%;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            padding: 1.5rem 1.8rem;
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 2rem; margin-bottom: 1rem; }

        .cart-items { max-height: 400px; overflow-y: auto; }

        .cart-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 1rem;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.95rem;
        }

        .cart-row:last-child { border-bottom: none; }

        .cart-item-name { font-weight: 600; }

        .qty-input {
            width: 60px;
            padding: 0.3rem 0.4rem;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            text-align: center;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .summary-total { font-size: 1.3rem; font-weight: 700; color: var(--accent-primary); }

        .btn {
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            margin-top: 0.8rem;
            width: 100%;
        }

        .btn-primary { background: var(--accent-primary); color: var(--bg-primary); }
        .btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--card-border); }

        .empty-state { text-align: center; color: var(--text-secondary); padding: 2rem 0; }

        @media (max-width: 768px) {
            .checkout-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Smart Organic Connect</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
        </div>
        <div class="cart-icon" onclick="window.location.href='cart.html'">
            🛒<span class="cart-count">0</span>
        </div>
    </nav>

    <div class="checkout-wrapper">
        <h1>Checkout</h1>
        <div class="checkout-grid">
            <div class="card">
                <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">Order Items</h2>
                <div id="checkoutItems" class="cart-items"></div>
            </div>
            <div class="card">
                <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">Order Summary</h2>
                <div id="orderSummary"></div>
                <button class="btn btn-primary" id="placeOrderBtn">Place Order</button>
                <button class="btn btn-secondary" onclick="window.location.href='marketplace.html'">Continue Shopping</button>
            </div>
        </div>
    </div>

    <script src="/static/js/cart.js"></script>
    <script>
        function formatINR(amount) {
            return '₹' + amount.toFixed(2);
        }

        function renderCheckout() {
            const items = window.cartManager ? window.cartManager.getCart() : [];
            const itemsContainer = document.getElementById('checkoutItems');
            const summaryContainer = document.getElementById('orderSummary');

            if (!items || items.length === 0) {
                itemsContainer.innerHTML = '<div class="empty-state">Your cart is empty. Add some products first.</div>';
                summaryContainer.innerHTML = '<div class="summary-row"><span>Total</span><span class="summary-total">₹0.00</span></div>';
                return;
            }

            let subtotal = 0;
            itemsContainer.innerHTML = '';

            items.forEach((item, index) => {
                const lineTotal = item.price * item.quantity;
                subtotal += lineTotal;
                const row = document.createElement('div');
                row.className = 'cart-row';
                row.innerHTML = `
                    <div class="cart-item-name">${item.name}</div>
                    <div>${formatINR(item.price)}</div>
                    <div>
                        <input type="number" min="1" value="${item.quantity}" class="qty-input" data-index="${index}">
                    </div>
                    <div>
                        <div>${formatINR(lineTotal)}</div>
                        <button class="remove-btn" data-index="${index}">Remove</button>
                    </div>
                `;
                itemsContainer.appendChild(row);
            });

            const delivery = subtotal > 0 ? 40 : 0;
            const total = subtotal + delivery;

            summaryContainer.innerHTML = `
                <div class="summary-row"><span>Subtotal</span><span>${formatINR(subtotal)}</span></div>
                <div class="summary-row"><span>Delivery</span><span>${delivery ? formatINR(delivery) : 'Free'}</span></div>
                <div class="summary-row" style="margin-top:0.5rem;"><span>Total</span><span class="summary-total">${formatINR(total)}</span></div>
            `;

            itemsContainer.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('change', e => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    const newQty = parseInt(e.target.value, 10) || 1;
                    const item = items[idx];
                    if (item && window.cartManager) {
                        window.cartManager.updateQuantity(item.id, newQty);
                        renderCheckout();
                    }
                });
            });

            itemsContainer.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    const item = items[idx];
                    if (item && window.cartManager) {
                        window.cartManager.removeFromCart(item.id);
                        renderCheckout();
                    }
                });
            });
        }

        async function placeOrderFromCheckout() {
            const authUser = JSON.parse(localStorage.getItem('authUser') || 'null');
            const authToken = localStorage.getItem('authToken');

            if (!authUser || !authToken || authUser.role !== 'customer') {
                alert('Please log in as a customer to place an order.');
                window.location.href = 'login.html';
                return;
            }

            const items = window.cartManager ? window.cartManager.getCart() : [];
            if (!items || items.length === 0) {
                alert('Your cart is empty.');
                return;
            }

            const orderItems = items
                .map(item => ({
                    product_id: parseInt(item.id, 10) || 0,
                    quantity: item.quantity || 1
                }))
                .filter(i => i.product_id);

            if (orderItems.length === 0) {
                alert('Could not determine products for this order.');
                return;
            }

            const payload = {
                customer_id: authUser.id,
                items: orderItems
            };

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    alert(err.detail || 'Failed to place order.');
                    return;
                }

                if (window.cartManager) {
                    window.cartManager.clearCart();
                }

                localStorage.setItem('orderSuccess', 'true');
                window.location.href = 'dashboard.html';
            } catch (e) {
                console.error('Error placing order from checkout:', e);
                alert('An error occurred while placing your order.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCheckout();
            const btn = document.getElementById('placeOrderBtn');
            btn.addEventListener('click', placeOrderFromCheckout);
        });
    </script>
</body>
</html>
