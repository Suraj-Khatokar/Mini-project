<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Organic Connect</title>
    <style>
        :root {
            --bg-primary: #0B1120;
            --bg-secondary: #003300;
            --accent-primary: #00FFC6;
            --accent-secondary: #00FF9C;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 255, 198, 0.2);
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(15px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            font-size: 1rem;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-primary);
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-outline:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0, 255, 198, 0.6);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: 2px solid var(--accent-primary);
        }

        .btn-primary:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            box-shadow: 0 0 20px rgba(0, 255, 198, 0.6);
            transform: translateY(-2px);
        }

        /* Login Section */
        .login-section {
            padding: 12rem 5% 6rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 3rem;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .login-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        /* User Type Tabs */
        .user-type-tabs {
            display: flex;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }

        .tab.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 4px 15px rgba(0, 255, 198, 0.3);
        }

        /* Forms */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 2px solid var(--card-border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 255, 198, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background: var(--accent-secondary);
            box-shadow: 0 0 25px rgba(0, 255, 198, 0.5);
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4444;
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 4px;
            border-left: 3px solid #ff4444;
        }

        .btn-loading {
            display: none;
        }

        .btn-text {
            display: inline-block;
        }

        .btn-text.hide {
            display: none;
        }

        .fa-spinner {
            margin-right: 8px;
        }

        .additional-links {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
        }

        .additional-links a {
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .additional-links a:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1.2rem;
                padding: 1rem 5%;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .login-section {
                padding: 10rem 5% 4rem;
            }

            .login-container {
                padding: 2rem;
            }

            .additional-links {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar - Same as homepage -->
    <nav class="navbar">
        <div class="logo">Smart Organic Connect</div>
        <div class="nav-links">
            <a href="/static/index.html">Home</a>
            <a href="/static/marketplace.html">Marketplace</a>
            <a href="/static/about.html">About</a>
            <a href="/static/contact.html">Contact</a>
        </div>
        <div class="auth-buttons">
            <a href="/static/login.html" class="btn btn-outline">Login</a>
            <a href="/static/signup.html" class="btn btn-primary">Sign Up</a>
        </div>
        <!-- User Menu (initially hidden) -->
        <div id="user-menu" class="user-menu">
            <a href="/static/cart.html" class="cart-icon"> <!--look at this part of the code once -->
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
            <div class="user-dropdown">
                <button class="user-btn">
                    <span class="user-name"></span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu">
                    <a href="/static/profile.html" class="dropdown-item">My Profile</a>
                    <a href="/static/orders.html" class="dropdown-item">My Orders</a>
                    <button id="logout-btn" class="dropdown-item">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <h1 class="login-title">Login</h1>
            <p class="login-subtitle">Access your account to continue your organic journey</p>
            
            <div class="user-type-tabs">
                <button class="tab active" onclick="switchTab('customer')">Customer</button>
                <button class="tab" onclick="switchTab('farmer')">Farmer</button>
            </div>

            <!-- Customer Login Form -->
            <div id="customer-form" class="form-section active">
                <form id="customer-login-form">
                    <div class="form-group">
                        <label for="customer-email">Email Address</label>
                        <input type="email" id="customer-email" name="email" class="form-input" 
                               placeholder="Enter your email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="customer-password">Password</label>
                        <input type="password" id="customer-password" name="password" 
                               class="form-input" placeholder="Enter your password" required 
                               autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn">
                        <span class="btn-text">Login as Customer</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> Signing in...
                        </span>
                    </button>
                </form>
                <div id="login-error" class="error-message" style="display: none;"></div>
            </div>

            <!-- Farmer Login Form -->
            <div id="farmer-form" class="form-section">
                <form>
                    <div class="form-group">
                        <label for="farmer-email">Email Address</label>
                        <input type="email" id="farmer-email" class="form-input" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="farmer-password">Password</label>
                        <input type="password" id="farmer-password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn">
                        <span class="btn-text">Login as Farmer</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> Signing in...
                        </span>
                    </button>
                </form>
                <div id="farmer-login-error" class="error-message" style="display: none;"></div>
            </div>

            <div class="additional-links">
                <a href="/static/forgot-password.html">Forgot Password?</a>
                <a href="/static/signup.html">Create New Account</a>
            </div>
        </div>
    </section>

    <script>
        function switchTab(type) {
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.toLowerCase().includes(type));
            });
            
            // Show the corresponding form
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.toggle('active', section.id === `${type}-form`);
            });
        }
    </script>
    <!-- Add Font Awesome for loading spinner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Scripts -->
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/nav-auth.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/auth.js"></script>
    <script type="module">
        // Debug: Log current URL and localStorage state
        console.log('Current URL:', window.location.href);
        console.log('Current auth state:', {
            hasToken: !!localStorage.getItem('authToken'),
            hasUser: !!localStorage.getItem('authUser')
        });

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            try {
                const authUser = localStorage.getItem('authUser');
                console.log('Auth user from localStorage:', authUser);
                
                if (authUser) {
                    const user = JSON.parse(authUser);
                    console.log('Parsed user data:', user);
                    redirectBasedOnRole(user.role);
                }
                
                // Add form submission handlers
                setupLoginForms();
            } catch (error) {
                console.error('Error in DOMContentLoaded:', error);
            }
        });

        function redirectBasedOnRole(role) {
            console.log('Redirecting based on role:', role);
            // Ensure role is properly formatted (lowercase)
            const normalizedRole = (role || '').toLowerCase();
            const redirectUrl = normalizedRole === 'farmer' ? 'farmer-dashboard.html' : 'dashboard.html';
            console.log('Redirecting to:', redirectUrl);
            window.location.href = redirectUrl;
        }

        function setupLoginForms() {
            // Customer login form
            const customerForm = document.querySelector('#customer-form form');
            if (customerForm) {
                customerForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    handleLogin('customer');
                });
            }

            // Farmer login form
            const farmerForm = document.querySelector('#farmer-form form');
            if (farmerForm) {
                farmerForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    handleLogin('farmer');
                });
            }
        }

        async function handleLogin(role) {
            const emailField = role === 'farmer' ? 'farmer-email' : 'customer-email';
            const passwordField = role === 'farmer' ? 'farmer-password' : 'customer-password';
            const email = document.getElementById(emailField).value;
            const password = document.getElementById(passwordField).value;
            const loginBtn = document.querySelector(`#${role}-form .login-btn`);
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoading = loginBtn.querySelector('.btn-loading');
            const errorElement = document.getElementById(role === 'farmer' ? 'farmer-login-error' : 'login-error');

            // Show loading state
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            errorElement.style.display = 'none';

            // Simulate login delay
            await new Promise(resolve => setTimeout(resolve, 1000));

            try {
                // Debug: Log the input values
                console.log('Login attempt:', { role, email, password });
                
                // Make API call to authenticate with database
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        role
                    })
                });

                const data = await response.json();
                console.log('Login response:', { status: response.status, data });

                if (!response.ok) {
                    throw new Error(data.detail || `Login failed with status ${response.status}`);
                }

                if (!data || !data.user) {
                    throw new Error('Invalid response from server');
                }
                
                // Store user data and token from server
                localStorage.setItem('authToken', data.token || '');
                localStorage.setItem('authUser', JSON.stringify(data.user));
                console.log('Login successful, user data:', data.user);

                // Redirect based on role from server response
                const redirectUrl = data.user.role === 'farmer' ? 'farmer-dashboard.html' : 'dashboard.html';
                console.log('Redirecting to:', redirectUrl);
                window.location.replace(redirectUrl);
                return; // Stop further execution

            } catch (error) {
                console.error('Login error:', error);
                errorElement.textContent = error.message || 'Failed to login. Please try again.';
                errorElement.style.display = 'block';
                
                // Reset button state
                btnText.style.display = 'inline-block';
                btnLoading.style.display = 'none';
                
                // Clear any potentially invalid auth data
                localStorage.removeItem('authToken');
                localStorage.removeItem('authUser');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/api.js" type="module"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/nav-auth.js"></script>
</body>
</html>
